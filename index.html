/* ============================================================
   REST TIMER
   ============================================================ */
let restInt=null, restLeft=0, restTotal=0, audioCtx=null;

function playBeep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    // 3 beeps curtos ascendentes
    [0,0.18,0.36].forEach((delay,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type='sine';
      osc.frequency.value = 660 + i*220; // tom sobe a cada beep
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime+delay+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+delay+0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime+delay);
      osc.stop(audioCtx.currentTime+delay+0.16);
    });
  }catch(e){ /* áudio indisponível */ }
}

function startRest(sec, label){
  // "acorda" o áudio no gesto do utilizador (necessário em mobile)
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
  restLeft = sec; restTotal = sec;
  const fab = $('#restFab');
  fab.classList.add('show');
  fab.classList.remove('done-flash');
  $('#restLabel').textContent = label ? ('Descanso · '+label) : 'Descanso';
  updRest();
  clearInterval(restInt);
  restInt = setInterval(()=>{
    restLeft--;
    updRest();
    if(restLeft<=0){
      clearInterval(restInt);
      $('#restFab').classList.add('done-flash');
      $('#restTime').textContent = 'Vai!';
      toast('Descanso terminado 💪');
      playBeep();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      setTimeout(()=>{ if(restLeft<=0) stopRest(); }, 4000);
    }
  },1000);
}
function updRest(){
  const m = Math.floor(restLeft/60), s = restLeft%60;
  $('#restTime').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const prog = $('#restProg');
  if(prog && restTotal>0){
    const pct = Math.max(0, restLeft/restTotal);
    prog.style.transform = `scaleX(${pct})`;
  }
}
function addRest(s){
  restLeft = Math.max(0, restLeft+s);
  if(restLeft>restTotal) restTotal = restLeft;
  if(restLeft>0) $('#restFab').classList.remove('done-flash');
  updRest();
}
function stopRest(){ clearInterval(restInt); $('#restFab').classList.remove('show','done-flash'); }

/* ============================================================
   FINISH
   ============================================================ */
function finishSession(){
  const cur = STATE.current;
  if(!cur){ nav('home'); return; }
  const plan = getPlan(cur.key);
  // calcula volume + guarda última carga por exercício
  let volume=0, totalSets=0;
  if(!STATE.lastLoads) STATE.lastLoads = {};
  for(const exid in cur.sets){
    const sets = cur.sets[exid];
    let exHasData = false;
    sets.forEach(s=>{
      if(s.done){ totalSets++; volume += (parseFloat(s.w)||0)*(parseInt(s.r)||0); }
      if(s.w || s.r) exHasData = true;
    });
    // guarda como última carga se houver dados registados
    if(exHasData){
      STATE.lastLoads[exid] = {
        sets: sets.filter(s=>s.w||s.r).map(s=>({w:s.w, r:s.r})),
        when: Date.now(),
      };
    }
  }
  const key = todayKey();
  if(!STATE.log[key]) STATE.log[key]=[];
  STATE.log[key].push({
    plan: cur.key,
    name: plan.data.name,
    color: plan.data.color||'var(--accent)',
    icon: plan.data.icon||'⚡',
    volume: Math.round(volume),
    sets: totalSets,
    when: Date.now(),
  });
  const broken = checkRecords(cur);
  STATE.current = null;
  stopRest();
  saveState();
  toast(broken.length ? `🏆 Novo recorde: ${broken[0].name} ${broken[0].w}kg×${broken[0].r}${broken.length>1?' (+'+(broken.length-1)+')':''}` : 'Treino registado! 🎉');
  nav('home');
}

// deteta e regista novos recordes pessoais (melhor peso, depois melhor reps) por exercício
function checkRecords(cur){
  const broken = [];
  for(const exid in cur.sets){
    const validSets = cur.sets[exid].filter(s=> (parseFloat(s.w)||0)>0 && (parseInt(s.r)||0)>0);
    if(!validSets.length) continue;
    let best = validSets[0];
    validSets.forEach(s=>{
      const w=parseFloat(s.w)||0, r=parseInt(s.r)||0;
      const bw=parseFloat(best.w)||0, br=parseInt(best.r)||0;
      if(w>bw || (w===bw && r>br)) best = s;
    });
    const w=parseFloat(best.w)||0, r=parseInt(best.r)||0;
    const prev = STATE.records[exid];
    const pw = prev?(parseFloat(prev.w)||0):0, pr = prev?(parseInt(prev.r)||0):0;
    if(!prev || w>pw || (w===pw && r>pr)){
      STATE.records[exid] = {w, r, when: Date.now()};
      broken.push({name: findEx(exid).n, w, r});
    }
  }
  return broken;
}

function discardSession(){
  if(confirm('Descartar este treino? O progresso registado nesta sessão será apagado e não vai para o histórico.')){
    STATE.current = null;
    stopRest();
    saveState();
    toast('Treino descartado');
    nav('home');
  }
}

/* ============================================================
   ALONGAMENTOS (plano diário)
   ============================================================ */
function stretchStreak(){
  let d = new Date();
  let key = dateKey(d);
  const doneOn = (k)=> STATE.stretchLog[k] && Object.values(STATE.stretchLog[k]).some(v=>v);
  // se hoje ainda não tens nada feito, a sequência conta a partir de ontem
  if(!doneOn(key)) d.setDate(d.getDate()-1);
  let streak=0;
  while(true){
    key = dateKey(d);
    if(doneOn(key)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

function renderStretch(){
  const now = new Date();
  const dow = now.getDay();

  const log = STATE.stretchLog[key];
  const items = plan.items.map(id=>({id, ...STRETCH_POOL[id]}));

    ${plan.sub ? `<div class="sh-why">${plan.sub}</div>` : ''}
    <div class="sh-progwrap">
      <div class="sh-progbar"><div class="sh-progfill" style="width:${pct}%"></div></div>
      <div class="sh-progtxt">${doneCount}/${items.length}</div>
    </div>
    ${doneCount===items.length && items.length>0 ? `<div class="sh-alldone">✅ Alongamento do dia completo!</div>` : ''}
  </div>`;

  html += items.map(it=> stretchItemCard(it, !!log[it.id])).join('');

  if(STATE.customStretchRoutines && Object.keys(STATE.customStretchRoutines).length){
    html += `<div class="sec-label">📥 As tuas rotinas importadas</div>`;
    for(const rid in STATE.customStretchRoutines){

      const rItems = r.items.map((it,i)=>({...it, id:'cst_'+rid+'_'+i}));

  $('#view-stretch').innerHTML = html;

  const allSessions=[];
  for(const date in STATE.log){
    STATE.log[date].forEach(s=> allSessions.push({...s,date}));
  }
  allSessions.sort((a,b)=> b.when-a.when);

  // stats
  const totalSessions = allSessions.length;
  const thisWeek = countThisWeek();
  const streak = calcStreak();
  const totalVol = allSessions.reduce((a,s)=>a+s.volume,0);

  let html = `<div class="stat-grid">
    <div class="stat"><div class="v accent">${thisWeek}</div><div class="l">Treinos esta semana</div></div>
    <div class="stat"><div class="v">${totalSessions}</div><div class="l">Treinos no total</div></div>
    <div class="stat"><div class="v">${streak}</div><div class="l">Dias seguidos (semana)</div></div>
    <div class="stat"><div class="v">${(totalVol/1000).toFixed(1)}t</div><div class="l">Volume total levantado</div></div>
  </div>`;

  // aderência ao horário semanal
  html += adherenceCard();

  // chart: últimas 6 semanas (nº treinos)
  html += weekChart();

  // heatmap muscular (últimos 7 dias)
  html += muscleHeatmapCard();

  // recordes pessoais
  html += prSection();

  // histórico
  html += `<div class="sec-label">Histórico</div>`;
  if(allSessions.length===0){
    html += `<div class="empty"><div class="ei">📋</div><p>Ainda não registaste treinos.<br>Começa pelo separador <b>Hoje</b>.</p></div>`;
  } else {
    allSessions.slice(0,30).forEach(s=>{
      const d = new Date(s.date+'T12:00');
      html += `<div class="hist-item">
        <div class="hdot" style="background:linear-gradient(135deg,${s.color}40,${s.color}14);color:${s.color}">${s.icon}</div>
        <div class="hinfo"><div class="ht">${s.name}</div><div class="hs">${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} · ${s.sets} séries</div></div>
        <div class="hvol"><b>${s.volume>0?(s.volume>=1000?(s.volume/1000).toFixed(1)+'t':s.volume+'kg'):'—'}</b>volume</div>
        <button class="hdel" onclick="deleteSession('${s.date}',${s.when})" aria-label="Apagar treino">🗑</button>
      </div>`;
    });
  }

  $('#view-progress').innerHTML = html;
}

function countThisWeek(){
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const monday=new Date(now); monday.setDate(now.getDate()-dow); monday.setHours(0,0,0,0);
  let c=0;
  for(const date in STATE.log){
    const d=new Date(date+'T12:00');
    if(d>=monday) c+=STATE.log[date].length;
  }
  return c;
}
function calcStreak(){
  // dias distintos treinados esta semana
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const monday=new Date(now); monday.setDate(now.getDate()-dow); monday.setHours(0,0,0,0);
  let days=new Set();
  for(const date in STATE.log){
    const d=new Date(date+'T12:00');
    if(d>=monday && STATE.log[date].length>0) days.add(date);
  }
  return days.size;
}
function weekChart(){
  const weeks=[];
  const now=new Date();
  for(let w=5;w>=0;w--){
    const ref=new Date(now); ref.setDate(now.getDate()-w*7);
    const dow=(ref.getDay()+6)%7;
    const monday=new Date(ref); monday.setDate(ref.getDate()-dow); monday.setHours(0,0,0,0);
    const sunday=new Date(monday); sunday.setDate(monday.getDate()+7);
    let count=0;
    for(const date in STATE.log){
      const d=new Date(date+'T12:00');
      if(d>=monday && d<sunday) count+=STATE.log[date].length;
    }
    weeks.push({count, label: w===0?'Esta':(monday.getDate()+'/'+(monday.getMonth()+1))});
  }
  const max=Math.max(4,...weeks.map(w=>w.count));
  const bars=weeks.map(w=>`<div class="bcol">
    <div class="bar-fill" style="height:${(w.count/max*100)}%"></div>
    <div class="blab">${w.label}</div>
  </div>`).join('');
  return `<div class="chart-card">
    <h4>Frequência de treino</h4>
    <div class="csub">Treinos por semana (últimas 6)</div>
    <div class="bars">${bars}</div>
  </div>`;
}

// conta, por grupo muscular, em quantas sessões (últimos N dias) esse grupo foi trabalhado
function muscleFrequency(days){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days); cutoff.setHours(0,0,0,0);
  const freq = {};
  for(const date in STATE.log){
    const d = new Date(date+'T12:00');
    if(d < cutoff) continue;
    STATE.log[date].forEach(s=>{
      let muscles = [];
      if(s.plan && STRENGTH[s.plan]) STRENGTH[s.plan].exercises.forEach(ex=> (ex.m||[]).forEach(m=>muscles.push(m)));
      else if(s.plan && s.plan.startsWith('plyo')) muscles = ['quads','glutes','calves'];
      [...new Set(muscles)].forEach(m=> freq[m]=(freq[m]||0)+1);
    });
  }
  return freq;
}

function muscleHeatmapCard(){
  const freq = muscleFrequency(7);
  const hasAny = Object.keys(freq).length>0;
  return `<div class="chart-card">
    <h4>🔥 Zonas trabalhadas</h4>
    <div class="csub">Últimos 7 dias · intensidade por grupo muscular</div>
    ${hasAny ? `<div class="heatmap-row">
      <div class="heatmap-body">${bodySVG([], freq)}<div class="hb-label">Frente</div></div>
      <div class="heatmap-body">${bodyBackSVG([], freq)}<div class="hb-label">Costas</div></div>
    </div>
    <div class="heat-legend">Menos<span class="hl-dot l0"></span><span class="hl-dot l1"></span><span class="hl-dot l2"></span><span class="hl-dot l3"></span>Mais</div>`
    : `<div class="empty" style="padding:24px 12px"><div class="ei">🧍</div><p>Treina esta semana para veres o mapa de calor.</p></div>`}
  </div>`;
}

function prSection(){
  const recs = Object.entries(STATE.records||{}).map(([exid,r])=>({exid, ...r, name: findEx(exid).n}));
  if(!recs.length) return '';
  recs.sort((a,b)=> b.when-a.when);
  const rows = recs.slice(0,10).map(r=>{
    const d = new Date(r.when);
    return `<div class="pr-item">
      <div class="pr-ic">🏆</div>
      <div class="pr-info"><div class="pr-nm">${r.name}</div><div class="pr-d">${d.getDate()}/${d.getMonth()+1}</div></div>
      <div class="pr-val">${r.w}kg × ${r.r}</div>
    </div>`;
  }).join('');
  return `<div class="sec-label">🏆 Recordes pessoais</div>${rows}`;
}

/* ============================================================
   MENU
   ============================================================ */
function deleteSession(date, when){
  if(!confirm('Apagar este treino do histórico?')) return;
  if(STATE.log[date]){
    STATE.log[date] = STATE.log[date].filter(s=> s.when!==when);
    if(STATE.log[date].length===0) delete STATE.log[date];
    saveState();
    toast('Treino apagado');
    renderProgress();
  }
}

// resumo curto do horário definido, para mostrar no Menu (ex.: "3 dias definidos de 7")
function scheduleSummary(){
  const days = [0,1,2,3,4,5,6].filter(d=> STATE.schedule && STATE.schedule[d]);
  return days.length ? `${days.length} dia${days.length!==1?'s':''} definido${days.length!==1?'s':''} de 7 · toca para editar` : 'Ainda não definiste nenhum dia';
}
// lista os planos embutidos que o utilizador apagou, com opção de restaurar
function hiddenPlansList(){
  const hidden = Object.keys(STATE.hiddenPlans||{});
  if(!hidden.length) return '';
  const rows = hidden.map(key=>{
    let name, icon;
    if(STRENGTH[key]){ name=STRENGTH[key].name; icon=STRENGTH[key].icon; }
    else if(key.startsWith('plyo_') && PLYO[key.slice(5)]){ name=PLYO[key.slice(5)].name; icon=PLYO[key.slice(5)].icon; }
    else { name=key; icon='📦'; }
    return `<button class="set-item" onclick="unhidePlan('${key}')"><div class="si-ic">${icon}</div><div class="si-tx"><div class="a">${name}</div><div class="b">Apagado — toca para restaurar</div></div><div class="si-ar">↺</div></button>`;
  }).join('');
  return `<div class="sec-label">Planos escondidos</div><div class="set-card">${rows}</div>`;
}

  </div>
  <div class="intro">

function toggleInstall(which){
  const el = document.getElementById('ins-'+which);
  if(el) el.classList.toggle('open');
}

function exportData(){
  const data = JSON.stringify({log:STATE.log, videos:STATE.videos, lastLoads:STATE.lastLoads, stretchLog:STATE.stretchLog, records:STATE.records, customPlans:STATE.customPlans, customStretchRoutines:STATE.customStretchRoutines, swaps:STATE.swaps, hiddenPlans:STATE.hiddenPlans, schedule:STATE.schedule, health:STATE.health});
  navigator.clipboard?.writeText(data).then(
    ()=>toast('Dados copiados para a área de transferência'),
    ()=>prompt('Copia os teus dados:', data)
  );
}
function importData(){
  const raw = prompt('Cola aqui os dados exportados:');
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    if(d.log) STATE.log = {...STATE.log, ...d.log};
    if(d.videos) STATE.videos = {...STATE.videos, ...d.videos};
    if(d.lastLoads) STATE.lastLoads = {...STATE.lastLoads, ...d.lastLoads};
    if(d.stretchLog) STATE.stretchLog = {...STATE.stretchLog, ...d.stretchLog};
    if(d.records) STATE.records = {...STATE.records, ...d.records};
    if(d.customPlans) STATE.customPlans = {...STATE.customPlans, ...d.customPlans};
    if(d.customStretchRoutines) STATE.customStretchRoutines = {...STATE.customStretchRoutines, ...d.customStretchRoutines};
    if(d.swaps) STATE.swaps = {...STATE.swaps, ...d.swaps};
    if(d.hiddenPlans) STATE.hiddenPlans = {...STATE.hiddenPlans, ...d.hiddenPlans};
    if(d.schedule) STATE.schedule = {...STATE.schedule, ...d.schedule};
    if(d.health) STATE.health = {...STATE.health, ...d.health};
    saveState(); toast('Dados importados ✓'); renderMenu();
  }catch(e){ toast('Dados inválidos'); }
}
function resetData(){
  if(confirm('Apagar todo o histórico de treinos? Não pode ser desfeito.')){
    STATE.log={}; saveState(); toast('Histórico limpo'); renderProgress();
  }
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadState();
  loadSyncCfg();
  renderHome();
  if(syncCfg){
    syncPull();
    setInterval(()=>{ if(syncCfg) syncPull(); }, 60000);
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(syncPushTimer) doSyncPush(); }
    else if(syncCfg) syncPull();
  });
})();
