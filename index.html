<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Treino · Hub</title>
<style>
:root{
  --bg:#0f1419;
  --surface:#1a212b;
  --surface-2:#232c38;
  --line:#2d3845;
  --text:#eef2f6;
  --text-dim:#8c9aab;
  --text-faint:#5a6675;
  --accent:#3dd6b5;
  --accent-deep:#1ea98a;
  --accent-soft:rgba(61,214,181,.12);
  --warn:#f2b134;
  --push:#5b9dff;
  --pull:#c77dff;
  --legs:#ff8a5b;
  --plyo:#3dd6b5;
  --radius:16px;
  --radius-sm:11px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --stretch:#7dd3c0;
  --shadow-card:0 10px 26px -16px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:radial-gradient(900px 480px at 50% -12%,rgba(61,214,181,.10),transparent 60%),var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none}
body{padding-bottom:78px;max-width:680px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(15,20,25,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 18px 12px}
.topbar h1{font-size:20px;font-weight:750;letter-spacing:-.4px}
.topbar .sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;font-weight:500}

/* ---------- Views ---------- */
.view{display:none;padding:16px 14px 24px;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Hero (sugestão de treino) ---------- */
.hero-card{background:linear-gradient(135deg,var(--accent-deep),#0f2b25 65%,var(--surface));border:1px solid var(--accent-deep);border-radius:var(--radius);padding:19px;margin-bottom:18px;box-shadow:0 16px 34px -18px rgba(30,169,138,.5);position:relative;overflow:hidden;width:100%;text-align:left}
.hero-card::after{content:'';position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
@keyframes heroShimmer{0%{background-position:-260% 0}100%{background-position:260% 0}}
.hero-card::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.09) 50%,transparent 65%);background-size:280% 100%;animation:heroShimmer 4.5s linear infinite;pointer-events:none}
.hero-badge{font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.72);margin-bottom:11px;position:relative;display:flex;align-items:center;gap:6px}
.hero-main{display:flex;align-items:center;gap:14px;margin-bottom:15px;position:relative}
.hero-ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:23px;font-weight:800;color:#fff;flex-shrink:0}
.hero-t{font-size:19.5px;font-weight:800;color:#fff;letter-spacing:-.3px}
.hero-s{font-size:12px;color:rgba(255,255,255,.72);margin-top:3px;font-weight:500}
.hero-cta{font-size:13.5px;font-weight:750;color:#06120e;background:#fff;display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:11px;position:relative}
.hero-ring{margin-left:auto;position:relative;width:44px;height:44px;flex-shrink:0}
.hero-ring .rg-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}

/* ---------- Quick stats (home) ---------- */
.quickstats{display:flex;gap:10px;margin-bottom:16px}
.qstat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:10px}
.qstat .qicon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0;transition:filter .3s}
.qstat.week .qicon{background:rgba(61,214,181,.15);color:var(--accent)}
.qstat.stretch .qicon{background:rgba(125,211,192,.15);color:var(--stretch)}
@keyframes flameGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(242,177,52,.7))}50%{filter:drop-shadow(0 0 5px rgba(242,177,52,.9))}}
.qstat .qicon.hot{animation:flameGlow 1.8s ease-in-out infinite}
.qstat .qtext{flex:1;min-width:0}
.qstat .qv{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1;font-variant-numeric:tabular-nums}
.qstat .ql{font-size:9.5px;color:var(--text-dim);margin-top:4px;font-weight:650;text-transform:uppercase;letter-spacing:.3px;line-height:1.3}

/* ---------- Week strip ---------- */
.weekstrip{display:flex;gap:6px;margin-bottom:18px}
.daycell{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 4px 8px;text-align:center;position:relative;box-shadow:var(--shadow-card)}
.daycell .dn{font-size:10px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.daycell .dd{font-size:15px;font-weight:700;margin-top:3px}
.daycell.today{border-color:var(--accent);background:linear-gradient(160deg,var(--accent-soft),var(--surface))}
.daycell.today .dd{color:var(--accent)}
.daycell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:4px auto 0}
.daycell .dot.empty{background:transparent}

/* ---------- Section heading ---------- */
.sec-label{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.7px;margin:22px 4px 11px;display:flex;align-items:center;gap:8px}
.sec-label:first-child{margin-top:4px}

/* ---------- Workout cards (day selector) ---------- */
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:11px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;transition:transform .12s,border-color .15s;box-shadow:var(--shadow-card);cursor:pointer}
.day-card:active{transform:scale(.985)}
.day-card .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.day-card .icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:21px;font-weight:800}
.day-card .info{flex:1;min-width:0}
.day-card .info h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.day-card .info p{font-size:12.5px;color:var(--text-dim);margin-top:3px;font-weight:500}
.day-card .chev{color:var(--text-faint);font-size:20px}
.day-card .badge{position:absolute;top:11px;right:13px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}

/* ---------- Accordion ---------- */
.accordion{margin-bottom:11px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-card)}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left}
.acc-head .tag{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.acc-head .htxt{flex:1}
.acc-head .htxt .t{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.acc-head .htxt .s{font-size:11.5px;color:var(--text-dim);margin-top:2px;font-weight:500}
.acc-head .arrow{color:var(--text-faint);transition:transform .25s;font-size:13px}
.acc-head.open .arrow{transform:rotate(90deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .32s ease}
.acc-inner{padding:2px 12px 12px}

/* ---------- Exercise row ---------- */
.ex{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:12px;padding:11px 12px}
.ex-thumb{width:44px;height:44px;border-radius:10px;background:#0c1117;flex-shrink:0;overflow:hidden;border:1px solid var(--line)}
.ex-thumb svg{width:100%;height:100%;display:block}
.ex-meta{flex:1;min-width:0}
.ex-meta .nm{font-size:14.5px;font-weight:650;letter-spacing:-.2px;line-height:1.25}
.ex-meta .rg{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-weight:600}
.ex-meta .rg b{color:var(--accent);font-weight:700}
.ex-toggle{width:30px;height:30px;border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--text-faint);flex-shrink:0;font-size:12px;transition:transform .2s,color .2s}
.ex-toggle.open{transform:rotate(45deg);color:var(--accent)}
.ex-done-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);right:52px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .2s}
.ex-head{position:relative}
.ex.completed .ex-done-dot{opacity:1}
.ex.completed .ex-thumb{border-color:var(--accent)}

/* ---------- Exercise detail (expand) ---------- */
.ex-detail{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--surface)}
.ex-detail-in{padding:4px 12px 13px}

/* ---------- Figura PT (demonstração animada, substitui vídeos externos) ---------- */
.pt-demo{margin-bottom:11px}
.pt-video{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:11px;overflow:hidden}
.pt-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pt-novideo{padding:22px 14px;text-align:center;color:var(--text-dim);font-size:13px;background:var(--bg);border-radius:11px}
.pt-tip{display:flex;gap:9px;align-items:flex-start;background:var(--bg);border-radius:9px;padding:10px 12px;margin-top:8px}
.pt-tip-ico{flex-shrink:0;line-height:1.4}
.pt-tip-tx{font-size:12.5px;color:var(--text-dim);line-height:1.5}

/* last load + rest recommendation */
.last-load{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:9px;padding:9px 12px;margin-bottom:8px;flex-wrap:wrap}
.last-load .ll-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:5px;flex-shrink:0}
.last-load.empty .ll-tag{color:var(--text-faint);background:var(--surface-2)}
.last-load .ll-data{font-size:13px;font-weight:650;color:var(--text);flex:1;font-variant-numeric:tabular-nums}
.last-load.empty .ll-data{color:var(--text-faint);font-weight:500}
.last-load .ll-date{font-size:11px;color:var(--text-faint);font-weight:600}
.rest-rec{font-size:12px;color:var(--text-dim);background:var(--bg);border-radius:9px;padding:8px 12px;margin-bottom:10px;font-weight:500}
.rest-rec b{color:var(--accent);font-weight:700}
.rest-rec .rest-why{color:var(--text-faint);font-size:11px}

/* sets table */
.sets-hd{display:grid;grid-template-columns:30px 1fr 1fr 42px;gap:8px;padding:0 4px 7px;font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.set-row{display:grid;grid-template-columns:30px 1fr 1fr 42px;gap:8px;align-items:center;margin-bottom:7px}
.set-row .snum{width:30px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text-dim)}
.set-row input{width:100%;height:34px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;text-align:center;color:var(--text);font-size:14px;font-weight:600;font-family:inherit}
.set-row input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.set-row .chk{width:42px;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--text-faint);transition:all .15s}
.set-row .chk.on{background:var(--accent);color:#06120e;border-color:var(--accent)}
.set-row.done input{border-color:var(--accent-deep)}
.addset{width:100%;padding:8px;border:1px dashed var(--line);border-radius:8px;color:var(--text-dim);font-size:12px;font-weight:600;margin-top:3px}
.addset:active{background:var(--surface-2)}

/* timed exercise (no weight) */
/* timed info — ver perto do fim do CSS */

/* ---------- Rest timer (floating) ---------- */
.rest-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:60;background:var(--surface-2);color:var(--text);border:1px solid var(--accent);border-radius:18px;padding:0;display:none;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.5);overflow:hidden;width:300px;max-width:calc(100vw - 28px);animation:pop .3s}
.rest-fab.show{display:flex}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.rest-prog{height:4px;background:var(--accent);width:100%;transform-origin:left;transition:transform 1s linear}
.rest-main{display:flex;align-items:center;gap:8px;padding:11px 12px}
.rest-fab .rt-center{flex:1;text-align:center}
.rest-fab .rt-label{font-size:10px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rest-fab .rt{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:var(--accent)}
.rest-fab .rt-ctrl{background:var(--surface);color:var(--text);border:1px solid var(--line);height:38px;min-width:46px;border-radius:10px;font-size:13px;font-weight:700}
.rest-fab .rt-ctrl:active{background:var(--bg)}
.rest-fab .rt-close{background:transparent;color:var(--text-faint);width:30px;height:38px;font-size:16px;font-weight:700}
.rest-fab.done-flash{border-color:var(--warn)}
.rest-fab.done-flash .rt{color:var(--warn)}

/* ---------- Finish bar ---------- */
.finish-bar{position:sticky;bottom:78px;z-index:30;padding:12px 4px 4px}
.finish-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#06120e;font-weight:750;font-size:15.5px;padding:15px;border-radius:14px;box-shadow:0 6px 20px rgba(61,214,181,.3);display:flex;align-items:center;justify-content:center;gap:8px}
.finish-btn:active{transform:scale(.99)}
.finish-btn.ghost{background:var(--surface);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.discard-btn{width:100%;background:transparent;color:var(--text-faint);font-size:12.5px;font-weight:600;padding:10px;margin-top:6px}
.discard-btn:active{color:#e8503a}

/* ---------- Resume banner ---------- */
.resume-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1.5px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;cursor:pointer;transition:transform .12s}
.resume-banner:active{transform:scale(.99)}
.resume-banner .rb-left{display:flex;align-items:center;gap:12px}
.resume-banner .rb-pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(61,214,181,.5)}50%{opacity:.6;box-shadow:0 0 0 7px rgba(61,214,181,0)}}
.resume-banner .rb-title{font-size:14.5px;font-weight:700;color:var(--text)}
.resume-banner .rb-sub{font-size:12px;color:var(--text-dim);margin-top:2px;font-weight:500}
.resume-banner .rb-arrow{font-size:22px;color:var(--accent);font-weight:700}

/* ---------- Back link ---------- */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13.5px;font-weight:600;margin-bottom:4px;padding:4px 0}

/* ---------- Progress ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-card)}
.stat .v{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat .l{font-size:11.5px;color:var(--text-dim);margin-top:6px;font-weight:600}
.stat .v.accent{color:var(--accent)}

.hist-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-card)}
.hist-item .hdot{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;font-weight:800;flex-shrink:0}
.hist-item .hinfo{flex:1}
.hist-item .hinfo .ht{font-size:14.5px;font-weight:700}
.hist-item .hinfo .hs{font-size:12px;color:var(--text-dim);margin-top:2px;font-weight:500}
.hist-item .hvol{text-align:right;font-size:12px;color:var(--text-dim);font-weight:600}
.hist-item .hvol b{display:block;color:var(--accent);font-size:15px;font-weight:750}

.empty{text-align:center;padding:48px 20px;color:var(--text-faint)}
.empty .ei{font-size:40px;margin-bottom:12px;opacity:.5}
.empty p{font-size:13.5px;line-height:1.5}

/* progress chart */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:8px}
.chart-card h4{font-size:13px;font-weight:700;margin-bottom:2px}
.chart-card .csub{font-size:11.5px;color:var(--text-dim);margin-bottom:14px;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:7px;height:120px}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bcol .bar-fill{width:100%;background:linear-gradient(to top,var(--accent-deep),var(--accent));border-radius:5px 5px 0 0;min-height:3px;transition:height .5s}
.bars .bcol .blab{font-size:9.5px;color:var(--text-faint);font-weight:600}

/* ---------- Recordes pessoais (PRs) ---------- */
.pr-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-card)}
.pr-ic{width:36px;height:36px;border-radius:10px;background:rgba(242,177,52,.14);color:var(--warn);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.pr-info{flex:1;min-width:0}
.pr-nm{font-size:14px;font-weight:650;letter-spacing:-.1px}
.pr-d{font-size:11px;color:var(--text-faint);margin-top:2px;font-weight:600}
.pr-val{font-size:14px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums;flex-shrink:0}

/* ---------- Muscle heatmap ---------- */
.heatmap-row{display:flex;gap:18px;justify-content:center;padding:6px 0 2px}
.heatmap-body{text-align:center}
.heatmap-body svg{width:96px;height:144px;border-radius:10px}
.hb-label{font-size:10.5px;color:var(--text-faint);font-weight:650;margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
.heat-legend{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:10.5px;color:var(--text-faint);font-weight:600}
.hl-dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-left:4px}
.hl-dot.l0{background:#3a4654}
.hl-dot.l1{background:#2a6f60}
.hl-dot.l2{background:#1ea98a}
.hl-dot.l3{background:#3dd6b5}

/* ---------- Bottom nav ---------- */
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(15,20,25,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;max-width:680px;margin:0 auto;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;color:var(--text-faint)}
.navbtn .nb-ic{width:34px;height:26px;display:grid;place-items:center;border-radius:9px;transition:background .2s}
.navbtn svg{width:21px;height:21px}
.navbtn span{font-size:10px;font-weight:600}
.navbtn.active{color:var(--accent)}
.navbtn.active .nb-ic{background:var(--accent-soft)}

/* toast */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:650;z-index:90;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* settings */
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.set-item{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set-item:last-child{border-bottom:none}
.set-item .si-ic{font-size:16px;width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0}
.set-item .si-tx{flex:1}
.set-item .si-tx .a{font-size:14.5px;font-weight:650}
.set-item .si-tx .b{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.set-item .si-ar{color:var(--text-faint)}

.intro{font-size:12.5px;color:var(--text-dim);line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:14px}
.intro b{color:var(--accent)}

/* install steps */
.install-steps{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:12.5px;color:var(--text-dim);line-height:1.7;background:var(--bg);border-bottom:1px solid var(--line)}
.install-steps.open{max-height:240px;padding:13px 16px}
.install-steps b{color:var(--text);font-weight:650}

/* order hint */
.order-hint{font-size:11.5px;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin:8px 0 14px;font-weight:600;line-height:1.4}

/* delete button in history */
.hist-item{position:relative}
.hdel{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;flex-shrink:0;margin-left:2px;opacity:.7;transition:all .15s}
.hdel:active{background:#3a1f1f;border-color:#6b2b2b;opacity:1}

/* last load indicator */
.last-load{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:9px;padding:9px 12px;margin-bottom:8px;flex-wrap:wrap}
.last-load .ll-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:5px;flex-shrink:0}
.last-load.empty .ll-tag{color:var(--text-faint);background:var(--surface-2)}
.last-load .ll-data{font-size:13px;font-weight:650;color:var(--text);flex:1;font-variant-numeric:tabular-nums}
.last-load.empty .ll-data{color:var(--text-faint);font-weight:500}
.last-load .ll-date{font-size:11px;color:var(--text-faint);font-weight:600}

/* rest button (principal — arranca o cronómetro) */
.rest-btn{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--accent);border-radius:11px;padding:11px 14px;margin:10px 0 4px;cursor:pointer;transition:background .15s,transform .1s}
.rest-btn:active{background:var(--accent-soft);transform:scale(.98)}
.rest-btn .rb-icon{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#06120e;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.rest-btn .rb-text{flex:1;font-size:13.5px;font-weight:650;color:var(--text);text-align:left}
.rest-btn .rb-text b{color:var(--accent)}
.rest-btn .rb-why{font-size:11px;color:var(--text-faint);font-weight:600;background:var(--surface-2);padding:3px 8px;border-radius:6px}

/* quick rest buttons (aquecimento/corretivo/alongamento) */
.quick-rest{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
.quick-rest .qr-label{font-size:11.5px;color:var(--text-faint);font-weight:600;margin-right:2px}
.quick-rest button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:all .15s}
.quick-rest button:active,.quick-rest button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* timed info */
.timed-info{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-dim);font-weight:600;background:var(--bg);border-radius:9px;padding:10px 12px;margin-bottom:2px}

/* ---------- Alongamentos (daily stretch plan) ---------- */
.stretch-hero{background:linear-gradient(135deg,rgba(125,211,192,.14),var(--surface));border:1.5px solid var(--stretch);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-card)}
.stretch-hero .sh-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.stretch-hero .sh-ic{width:44px;height:44px;border-radius:12px;background:rgba(125,211,192,.16);color:var(--stretch);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.stretch-hero .sh-t{font-size:17px;font-weight:750;letter-spacing:-.3px}
.stretch-hero .sh-s{font-size:12.5px;color:var(--text-dim);margin-top:2px;font-weight:500}
.sh-why{font-size:12.5px;color:var(--text-dim);line-height:1.5;background:var(--bg);border-radius:10px;padding:9px 11px;margin-bottom:12px}
.sh-progwrap{display:flex;align-items:center;gap:10px}
.sh-progbar{flex:1;height:7px;border-radius:20px;background:var(--surface-2);overflow:hidden}
.sh-progfill{height:100%;background:linear-gradient(90deg,var(--stretch),var(--accent));border-radius:20px;transition:width .35s ease}
.sh-progtxt{font-size:12px;font-weight:700;color:var(--stretch);flex-shrink:0;font-variant-numeric:tabular-nums}
.sh-alldone{font-size:12.5px;color:var(--stretch);font-weight:650;margin-top:10px;display:flex;align-items:center;gap:6px}

.stretch-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px;overflow:hidden;transition:border-color .15s,background .15s;box-shadow:var(--shadow-card)}
.stretch-item.done{border-color:var(--stretch);background:rgba(125,211,192,.06)}
.stretch-item .st-head{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;cursor:pointer}
.stretch-item .st-chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:transparent;flex-shrink:0;margin-top:1px;transition:all .15s;cursor:pointer}
.stretch-item.done .st-chk{background:var(--stretch);border-color:var(--stretch);color:#06120e}
.stretch-item .st-body{flex:1;min-width:0}
.stretch-item .st-nm{font-size:14.5px;font-weight:650;letter-spacing:-.2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stretch-item .st-nm .star{color:var(--warn);font-size:12px}
.stretch-item .st-t{font-size:11.5px;color:var(--stretch);font-weight:700;margin-top:3px}
.stretch-item .st-cue{font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:6px}
.stretch-item.done .st-nm{color:var(--text-dim)}

.weekpills{display:flex;gap:5px;margin-bottom:16px}
.wpill{flex:1;text-align:center;padding:7px 2px;border-radius:9px;font-size:10.5px;font-weight:700;color:var(--text-faint);background:var(--surface);border:1px solid var(--line)}
.wpill.today{color:var(--stretch);border-color:var(--stretch);background:rgba(125,211,192,.1)}

/* ---------- Biblioteca / trocar exercício / criar plano ---------- */
.swap-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);color:var(--text-dim);border-radius:11px;padding:10px 14px;margin:0 0 10px;font-size:13px;font-weight:650}
.swap-btn:active{transform:scale(.99)}
.lib-search{width:100%;padding:11px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:14px;margin-bottom:12px}
.lib-search::placeholder{color:var(--text-faint)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.ovl-panel{background:var(--bg);width:100%;max-width:680px;max-height:88vh;border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideup .2s ease}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.ovl-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.ovl-title{font-size:15.5px;font-weight:750;letter-spacing:-.2px}
.ovl-close{font-size:18px;color:var(--text-dim);padding:4px 8px}
.ovl-body{overflow-y:auto;padding:14px 18px 28px}
.ovl-tabs{display:flex;gap:6px;margin-bottom:4px}
.ovl-tab{padding:7px 13px;border-radius:20px;font-size:12px;font-weight:650;background:var(--surface);border:1px solid var(--line);color:var(--text-dim)}
.ovl-tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lib-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lib-item:last-child{border-bottom:none}
.li-thumb{width:38px;height:54px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#0c1117}
.li-thumb svg{width:100%;height:100%;display:block}
.lib-info{flex:1;min-width:0}
.lib-nm{font-size:13.5px;font-weight:650}
.lib-tag{font-size:10.5px;color:var(--text-faint);margin-top:2px;font-weight:650;text-transform:uppercase;letter-spacing:.3px}
.lib-cue{font-size:11.5px;color:var(--text-dim);margin-top:4px;line-height:1.4}
.lib-add{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--accent);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.pb-chip{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:7px 8px 7px 13px;font-size:12.5px;font-weight:650;margin:0 6px 8px 0}
.pb-chip button{font-size:14px;line-height:1;color:var(--accent)}
</style>
</head>

<script>
/* ============================================================
   TREINO HUB — workout tracker
   Dados: planos de força (Caliber) + corretivo + alongamento + pliometria
   ============================================================ */

/* ---------- Ilustrações de músculos (SVG body, grupo destacado) ---------- */
// heatMap (opcional): { grupo: contagem } — pinta por intensidade em vez de vermelho binário
function heatColor(n){
  if(!n) return '#3a4654';
  if(n===1) return '#2a6f60';
  if(n===2) return '#1ea98a';
  return '#3dd6b5';
}
function bodySVG(highlight, heatMap){
  highlight = highlight || [];
  // highlight: array de grupos a pintar a vermelho (ou heatMap: contagem por grupo)
  const h = (g)=> heatMap ? heatColor(heatMap[g]) : (highlight.includes(g) ? '#e8503a' : '#3a4654');
  return `<svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
  <rect width="60" height="90" fill="#0c1117"/>
  <!-- cabeça -->
  <circle cx="30" cy="11" r="6" fill="#2b3542"/>
  <!-- pescoço -->
  <rect x="27" y="16" width="6" height="4" fill="#2b3542"/>
  <!-- ombros -->
  <ellipse cx="19" cy="24" rx="6" ry="5" fill="${h('shoulders')}"/>
  <ellipse cx="41" cy="24" rx="6" ry="5" fill="${h('shoulders')}"/>
  <!-- peito -->
  <path d="M22 22 h16 v9 q-8 4 -16 0 z" fill="${h('chest')}"/>
  <!-- abdominais -->
  <rect x="24" y="32" width="12" height="13" rx="2" fill="${h('abs')}"/>
  <!-- biceps -->
  <ellipse cx="15" cy="34" rx="4" ry="7" fill="${h('biceps')}"/>
  <ellipse cx="45" cy="34" rx="4" ry="7" fill="${h('biceps')}"/>
  <!-- triceps (parte de trás, mostrado lateral) -->
  <ellipse cx="13" cy="35" rx="2.5" ry="6" fill="${h('triceps')}"/>
  <ellipse cx="47" cy="35" rx="2.5" ry="6" fill="${h('triceps')}"/>
  <!-- antebraços -->
  <rect x="12" y="42" width="5" height="11" rx="2.5" fill="${h('forearms')}"/>
  <rect x="43" y="42" width="5" height="11" rx="2.5" fill="${h('forearms')}"/>
  <!-- quadriceps -->
  <path d="M24 46 h5 v18 q-2.5 2 -5 0 z" fill="${h('quads')}"/>
  <path d="M31 46 h5 v18 q-2.5 2 -5 0 z" fill="${h('quads')}"/>
  <!-- gemeos -->
  <rect x="24.5" y="66" width="4.5" height="14" rx="2" fill="${h('calves')}"/>
  <rect x="31" y="66" width="4.5" height="14" rx="2" fill="${h('calves')}"/>
  <!-- pés -->
  <rect x="24" y="81" width="5" height="4" rx="1.5" fill="${h('feet')}"/>
  <rect x="31" y="81" width="5" height="4" rx="1.5" fill="${h('feet')}"/>
  </svg>`;
}
function bodyBackSVG(highlight, heatMap){
  highlight = highlight || [];
  const h = (g)=> heatMap ? heatColor(heatMap[g]) : (highlight.includes(g) ? '#e8503a' : '#3a4654');
  return `<svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
  <rect width="60" height="90" fill="#0c1117"/>
  <circle cx="30" cy="11" r="6" fill="#2b3542"/>
  <rect x="27" y="16" width="6" height="4" fill="#2b3542"/>
  <!-- trapézio -->
  <path d="M24 19 h12 l-2 7 h-8 z" fill="${h('traps')}"/>
  <!-- ombros post -->
  <ellipse cx="19" cy="24" rx="5.5" ry="5" fill="${h('rear_delts')}"/>
  <ellipse cx="41" cy="24" rx="5.5" ry="5" fill="${h('rear_delts')}"/>
  <!-- lats / costas -->
  <path d="M22 26 h16 l-2 16 q-6 4 -12 0 z" fill="${h('back')}"/>
  <!-- lombar -->
  <rect x="25" y="40" width="10" height="7" rx="2" fill="${h('lower_back')}"/>
  <!-- triceps -->
  <ellipse cx="14" cy="35" rx="4" ry="7" fill="${h('triceps')}"/>
  <ellipse cx="46" cy="35" rx="4" ry="7" fill="${h('triceps')}"/>
  <!-- antebraços -->
  <rect x="12" y="43" width="5" height="11" rx="2.5" fill="${h('forearms')}"/>
  <rect x="43" y="43" width="5" height="11" rx="2.5" fill="${h('forearms')}"/>
  <!-- glúteos -->
  <ellipse cx="26" cy="50" rx="5" ry="5" fill="${h('glutes')}"/>
  <ellipse cx="34" cy="50" rx="5" ry="5" fill="${h('glutes')}"/>
  <!-- isquiotibiais -->
  <rect x="24" y="55" width="5" height="13" rx="2" fill="${h('hamstrings')}"/>
  <rect x="31" y="55" width="5" height="13" rx="2" fill="${h('hamstrings')}"/>
  <!-- gémeos -->
  <rect x="24.5" y="69" width="4.5" height="13" rx="2" fill="${h('calves')}"/>
  <rect x="31" y="69" width="4.5" height="13" rx="2" fill="${h('calves')}"/>
  </svg>`;
}

/* ============================================================
   DEFINIÇÃO DOS EXERCÍCIOS
   tipo: 'weight' (regista peso+reps) ou 'timed' (tempo/reps fixos)
   ============================================================ */

// PLANOS DE FORÇA (dos teus prints Caliber)
const STRENGTH = {
  push:{ name:'Push', color:'var(--push)', icon:'P', exercises:[
    {id:'p1', rest:150, n:'Barbell Bench Press', m:['chest'], front:1, range:'3 × 6-12', sets:3, cue:'Escápulas retraídas e fixas no banco. Desce a barra ao peito, cotovelos a ~45°. Pés firmes no chão.'},
    {id:'p2', rest:75, n:'Cable Seated Fly', m:['chest'], front:1, range:'3 × 6-12', sets:3, cue:'Ligeira flexão dos cotovelos fixa. Junta as mãos à frente apertando o peito. Controla o regresso.'},
    {id:'p3', rest:150, n:'Barbell Seated Shoulder Press', m:['shoulders'], front:1, range:'3 × 6-12', sets:3, cue:'Core apertado, não arquees a lombar. Barra sobe sobre a cabeça sem trancar bruscamente.'},
    {id:'p4', rest:75, n:'Cable Single Arm Lateral Raise', m:['shoulders'], front:1, range:'3 × 6-12', sets:3, cue:'Sobe o braço até à linha do ombro, mindinho ligeiramente acima. Sem balançar o tronco.'},
    {id:'p5', rest:75, n:'Cable Tricep Pushdown', m:['triceps'], front:1, range:'3 × 6-12', sets:3, cue:'Cotovelos colados ao tronco. Estende totalmente em baixo, controla a subida.'},
    {id:'p6', rest:120, n:'Push-Up', m:['chest'], front:1, range:'3 × 6-12', sets:3, cue:'Corpo em linha reta, core ativo. Desce o peito até perto do chão, cotovelos a ~45°.'},
    {id:'p7', rest:75, n:'Cable Tricep Extension', m:['triceps'], front:1, range:'3 × 6-12', sets:3, cue:'Cotovelos altos e fixos. Estende sobre a cabeça sentindo o tríceps alongar e contrair.'},
  ]},
  pull:{ name:'Pull', color:'var(--pull)', icon:'L', exercises:[
    {id:'l1', rest:150, n:'Pull-Up', m:['back'], front:0, range:'3 × 8-12', sets:3, cue:'Pega à largura dos ombros. Puxa o peito à barra, omoplatas para baixo e para dentro. Desce controlado.'},
    {id:'l2', rest:120, n:'Cable Lat Pulldown', m:['back'], front:0, range:'3 × 8-10', sets:3, cue:'Peito alto, puxa a barra ao peito superior. Lidera o movimento com os cotovelos, não as mãos.'},
    {id:'l3', rest:120, n:'Cable Seated Row', m:['back','traps'], front:0, range:'3 × 8-10', sets:3, cue:'Tronco direito, puxa ao abdómen apertando as omoplatas. Não uses impulso lombar.'},
    {id:'l4', rest:90, n:'Cable Single Arm Seated High Row', m:['back','rear_delts'], front:0, range:'3 × 6-12', sets:3, cue:'Puxa em ângulo alto, cotovelo afastado. Foco no controlo escapular de cada lado.'},
    {id:'l5', rest:75, n:'Cable Curl', m:['biceps'], front:1, range:'3 × 8-10', sets:3, cue:'Cotovelos fixos ao lado do corpo. Curl completo sem balançar, contrai no topo.'},
    {id:'l6', rest:75, n:'Dumbbell Hammer Curl', m:['biceps','forearms'], front:1, range:'3 × 8-12', sets:3, cue:'Pega neutra (martelo). Sobe sem rodar o pulso, controla a descida.'},
  ]},

// classifica um exercício (pelo nome, em inglês — usado nos exercícios de ginásio/pliometria/
// arquivo Notion) no padrão de movimento mais próximo. Os itens de aquecimento/corretivo/
// alongamento (nomes em português) já vêm com "pat" atribuído à mão nos seus próprios dados.
function movementPattern(name){
  const n = (name||'').toLowerCase();
  if(/sprint|agility|5-10-5|reactive cut/.test(n)) return 'sprint';
  if(/lateral bound|skater|hurdle/.test(n)) return 'lateral-jump';
  if(/\bjump\b|pogo|broad jump/.test(n)) return 'jump';
  if(/squat|lunge|step.?up/.test(n)) return 'squat';
  if(/deadlift|romanian|\brdl\b|hip thrust|good morning/.test(n)) return 'hinge';
  if(/calf/.test(n)) return 'calf-raise';
  if(/curl|21s/.test(n)) return 'curl';
  if(/pushdown|kickback|overhead.*tricep|tricep.*(overhead|extension)|skullcrusher|french press/.test(n)) return 'triceps-ext';
  if(/lateral raise|y-raise|front raise|\braise\b/.test(n)) return 'lateral-raise';
  if(/row|pulldown|pull.?up|pull.?over|face pull|pull.?around/.test(n)) return 'pull';
  if(/\bpress\b|push.?up|bench|\bfly\b|\bdip\b/.test(n)) return 'press';
  if(/plank|pallof|copenhagen|short foot|balance|clamshell|glute bridge|bird.?dog/.test(n)) return 'plank-hold';
  if(/rotation|twist|open book|thoracic/.test(n)) return 'rotation';
  return 'stretch-hold';
}
// bloco completo: vídeo real embutido (sem sair da app) + dica — nunca abre o YouTube numa nova aba.
// videoIdOverride serve para exercícios importados (planos do Knowledge Vault), que trazem o
// próprio vídeo junto ao item em vez de depender do catálogo EXERCISE_VIDEOS.
function ptDemo(name, cue, pattern, videoIdOverride){
  pattern = pattern || movementPattern(name);
  const isGenericArchiveCue = cue && cue.indexOf('Do arquivo de exercícios do Notion')===0;
  const tip = (cue && !isGenericArchiveCue) ? cue : (PT_PATTERN_TIPS[pattern] || cue || PT_PATTERN_TIPS['stretch-hold']);
  const v = videoIdOverride ? { id: videoIdOverride, title: name } : EXERCISE_VIDEOS[name];
  const video = v
    ? `<div class="pt-video"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&modestbranding=1" title="${escAttr(v.title||name)}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`
    : `<div class="pt-novideo">🎥 Vídeo ainda não disponível para este exercício</div>`;
  return `<div class="pt-demo">
    ${video}
    <div class="pt-tip"><span class="pt-tip-ico">💡</span><span class="pt-tip-tx">${tip}</span></div>
  </div>`;
}

function buildLibrary(){
  const lib = [];
  const seen = new Set();
  for(const k in STRENGTH){
    STRENGTH[k].exercises.forEach(ex=>{
      if(seen.has(ex.id)) return; seen.add(ex.id);
      lib.push({id:ex.id, n:ex.n, cat:'ginasio', catLabel:'Ginásio', m:ex.m, front:ex.front, cue:ex.cue, range:ex.range, sets:ex.sets, rest:ex.rest});
    });
  }
  NOTION_ARCHIVE.forEach(ex=>{
    const id = 'arch_'+slug(ex.n);
    if(seen.has(id)) return; seen.add(id);
    const map = NOTION_GROUP_MAP[ex.grupo] || {m:null, front:1};
    lib.push({
      id, n:ex.n, cat:'arquivo', catLabel:'Arquivo (Notion)',
      m: map.m?[map.m]:null, front: map.front,
      cue: `Do arquivo de exercícios do Notion · grupo: ${ex.grupo} · ${NOTA_LABEL[ex.nota]||ex.nota}.`,
      range:'3 × 8-12', sets:3, rest: archRest(ex.n),
    });
  });
  for(const k in PLYO){
    PLYO[k].exercises.forEach((ex,i)=>{
      const id = 'plyo_'+k+'_'+slug(ex.n);
      if(seen.has(id)) return; seen.add(id);
      lib.push({id, n:ex.n, cat:'pliometria', catLabel:'Pliometria', m:null, front:1, cue:ex.cue, t:ex.t, range:ex.t, sets:3, rest:120});

  for(const k in SUPPORT){
    (SUPPORT[k].corrective||[]).forEach(ex=>{

}

  try{ const k='__t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();

async function loadState(){
  try{

    if(hasLocalStorage){
      raw = window.localStorage.getItem('treino_state');
    } else if(window.storage){
      const r = await window.storage.get('treino_state');
      raw = r && r.value;
    }
    if(raw){ STATE = JSON.parse(raw); }
  }catch(e){ /* primeira utilização */ }
  if(!STATE.log) STATE.log = {};
  if(!STATE.videos) STATE.videos = {};
  if(!STATE.lastLoads) STATE.lastLoads = {};
  if(!STATE.stretchLog) STATE.stretchLog = {};

/* Cria, uma única vez, dois planos personalizados prontos a usar a partir do
   arquivo de exercícios do Notion — cobre Peito+Ombro+Tríceps (Push) e
   Costas+Bíceps (Pull), 3 exercícios por grupo muscular × 3 séries = 9
   séries/grupo/semana (regra do Notion). O arquivo ainda não tem exercícios
   para Quadríceps/Gémeos/Abdominais, por isso não há um plano "Legs (Notion)"
   — assim que o Rodrigo preencher essa parte no Notion, pede-se de novo.
   Só corre no primeiro arranque; depois disto o utilizador pode editar ou
   apagar estes planos livremente sem que voltem a aparecer. */
async function seedNotionPlans(){
  if(STATE.notionPlanSeeded) return;
  STATE.customPlans = STATE.customPlans || {};
  const mk = (libId)=>{
    const e = EXERCISE_LIBRARY.find(x=>x.id===libId);
    if(!e) return null;
    return { id:e.id, n:e.n, m:e.m, front:e.front, cue:e.cue, range:'3 × 8-12', sets:3, rest:e.rest };
  };
  if(!STATE.customPlans['notion_push']){
    STATE.customPlans['notion_push'] = {
      id:'notion_push', name:'Push (Arquivo Notion)', icon:'📓', color:'var(--push)', createdAt:Date.now(),
      exercises:[
        mk('arch_machine_chest_press'), mk('arch_incline_bench_press'), mk('arch_seated_cable_peach_fly'),
        mk('arch_seated_overhead_press'), mk('arch_cable_lateral_raise'), mk('arch_cable_y_raise'),
        mk('arch_overhead_tricep_extension'), mk('arch_cable_tricep_kickbacks'), mk('arch_skullcrusher'),
      ].filter(Boolean),
    };
  }
  if(!STATE.customPlans['notion_pull']){
    STATE.customPlans['notion_pull'] = {
      id:'notion_pull', name:'Pull (Arquivo Notion)', icon:'📓', color:'var(--pull)', createdAt:Date.now(),
      exercises:[
        mk('arch_chest_suported_rows'), mk('arch_neutral_grip_lat_pulldowns'), mk('arch_meadows_row'),
        mk('arch_bayesian_cable_curl'), mk('arch_machine_preacher_curl'), mk('arch_incline_curl'),
      ].filter(Boolean),
    };
  }
  STATE.notionPlanSeeded = true;
  await saveState();
}
async function saveState(opts){
  opts = opts || {};
  if(!opts.fromSync) STATE._updatedAt = Date.now();
  try{
    const data = JSON.stringify(STATE);
    if(hasLocalStorage){
      window.localStorage.setItem('treino_state', data);
    } else if(window.storage){
      await window.storage.set('treino_state', data);
    }
  }catch(e){ console.error('save failed', e); }
  if(!opts.fromSync) syncPush();
}

/* ============================================================
   SINCRONIZAÇÃO ENTRE DISPOSITIVOS (Supabase, opcional e grátis)
   Mesmo modelo "blob por app" que as outras apps do Vida OS já usam —
   se já tens um projeto Supabase configurado noutra app, podes reutilizá-lo
   aqui (mesma URL/chave), só o código de sincronização precisa de ser igual
   nos teus dispositivos para os treinos ficarem ligados entre eles.
   ============================================================ */
const SYNC_APP = 'gymos';
let syncCfg = null;
function loadSyncCfg(){
  const s = STATE.sync || {};
  syncCfg = (s.url && s.key && s.code) ? { url: s.url.replace(/\/$/,''), key: s.key, code: s.code } : null;
  return syncCfg;
}
function syncAuthHeaders(key){
  const h = { apikey: key };
  if(key && key.indexOf('eyJ')===0) h.Authorization = 'Bearer '+key;
  return h;
}
let syncPushTimer = null;
function syncPush(){
  if(!syncCfg) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(doSyncPush, 1200);
}
async function doSyncPush(){
  if(!syncCfg) return;
  try{
    const body = [{ app: SYNC_APP, sync_code: syncCfg.code, data: STATE, updated_at: new Date(STATE._updatedAt||Date.now()).toISOString() }];
    const r = await fetch(`${syncCfg.url}/rest/v1/app_state?on_conflict=app,sync_code`, {
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'}, syncAuthHeaders(syncCfg.key)),
      body: JSON.stringify(body),
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
  }catch(e){ console.warn('sync push falhou', e); }
}
// junta duas cópias do estado sem perder dados: treinos registados nos dois lados juntam-se por
// dia (sem duplicar a mesma sessão), e as tabelas simples (vídeos, recordes, planos, horário…)
// ficam com as entradas dos dois lados — a sessão em curso nunca sincroniza (é só do dispositivo).
function mergeGymState(local, remote){
  const remoteNewer = (remote._updatedAt||0) >= (local._updatedAt||0);
  const newer = remoteNewer ? remote : local, older = remoteNewer ? local : remote;
  const out = JSON.parse(JSON.stringify(newer));
  out.log = out.log || {};
  const oldLog = older.log || {};
  for(const date in oldLog){
    const cur = out.log[date] || [];
    const seen = new Set(cur.map(s=>s.when));
    oldLog[date].forEach(s=>{ if(!seen.has(s.when)){ cur.push(s); seen.add(s.when); } });
    out.log[date] = cur;
  }
  ['videos','lastLoads','records','stretchLog','customPlans','customStretchRoutines','swaps','hiddenPlans','schedule','health'].forEach(field=>{
    const obj = out[field] && typeof out[field]==='object' ? out[field] : {};
    const old = older[field] || {};
    for(const k in old) if(!(k in obj)) obj[k] = old[k];
    out[field] = obj;
  });
  out.current = local.current || null;
  out._updatedAt = Math.max(local._updatedAt||0, remote._updatedAt||0);
  return out;
}
async function syncPull(){
  if(!syncCfg) return;
  try{
    const url = `${syncCfg.url}/rest/v1/app_state?app=eq.${SYNC_APP}&sync_code=eq.${encodeURIComponent(syncCfg.code)}&select=data,updated_at`;
    const r = await fetch(url, { headers: syncAuthHeaders(syncCfg.key) });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    if(!rows.length){ syncPush(); return; }
    const remote = rows[0].data || {};
    const merged = mergeGymState(STATE, remote);
    const changed = JSON.stringify(merged) !== JSON.stringify(STATE);
    if(changed){ STATE = merged; await saveState({fromSync:true}); renderCurrentView(); }
  }catch(e){ console.warn('sync pull falhou', e); }
}
async function syncTest(cfg){
  const u = cfg.url.replace(/\/$/,'');
  const r = await fetch(`${u}/rest/v1/app_state?select=app&limit=1`, { headers: syncAuthHeaders(cfg.key) });
  if(!r.ok) throw new Error('HTTP '+r.status+' — verifica URL/chave e se a tabela "app_state" existe.');
  return true;
}
// re-renderiza o que estiver visível no momento (usado depois de um pull trazer dados novos)
function renderCurrentView(){
  const active = document.querySelector('.view.active');
  if(!active) return;
  const id = active.id.replace('view-','');
  if(id==='home') renderHome();
  else if(id==='stretch') renderStretch();
  else if(id==='progress') renderProgress();

  else if(id==='library') renderLibraryView();

  else if(id==='plans') renderPlansView();
  // sessão/builder não se re-renderizam sozinhos: evita perder o que está a meio de editar/registar
}
const SYNC_SQL = `-- Só precisas de correr isto se AINDA NÃO tiveres a tabela "app_state" criada
-- (se já sincronizas outra app do Vida OS com Supabase, esta tabela já existe — não precisas de repetir).
create table if not exists app_state (
  app text not null,
  sync_code text not null,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  primary key (app, sync_code)
);
alter table app_state enable row level security;
create policy "acesso por codigo" on app_state
  for all using (true) with check (true);`;
function saveSyncCfg(){
  const url = ($('#sy-url')||{}).value || ''; const key = ($('#sy-key')||{}).value || ''; const code = ($('#sy-code')||{}).value || '';
  STATE.sync = { url: url.trim(), key: key.trim(), code: code.trim() };

  const st = $('#sy-status');

  if(syncCfg) syncPull();
}
async function testSyncCfg(){

}
function showSyncSQL(){
  const html = `<p style="font-size:12px;color:var(--text-dim);font-weight:500;margin:0">Cola no SQL Editor e clica RUN — só é preciso se ainda não tiveres esta tabela de outra app.</p>

function weekGoalRingSVG(){
  const pct = Math.min(1, countThisWeek()/WEEKLY_GOAL);
  const r = 17, c = 2*Math.PI*r;
  const off = (c*(1-pct)).toFixed(1);
  return `<div class="hero-ring">
    <svg viewBox="0 0 40 40" width="44" height="44">
      <circle cx="20" cy="20" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="4"/>
      <circle cx="20" cy="20" r="${r}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off}" transform="rotate(-90 20 20)" style="transition:stroke-dashoffset .5s ease"/>
    </svg>
    <div class="rg-txt">${countThisWeek()}/${WEEKLY_GOAL}</div>
  </div>`;
}

function weekStrip(){
  const now = new Date();
  const dow = (now.getDay()+6)%7; // segunda=0
  let html = '<div class="weekstrip">';
  for(let i=0;i<7;i++){
    const d = new Date(now); d.setDate(now.getDate()-dow+i);
    const key = dateKey(d);
    const trained = STATE.log[key] && STATE.log[key].length>0;
    const isToday = key===todayKey();
    const sched = STATE.schedule && STATE.schedule[d.getDay()];
    const schedIco = sched==='rest' ? '😴' : sched==='run' ? '🏃' : (sched && planExists(sched)) ? (getPlan(sched).data.icon||'💪') : '';
    html += `<div class="daycell ${isToday?'today':''}">

      <div class="dot ${trained?'':'empty'}"></div>

// um planKey ainda existe e não foi apagado pelo utilizador?
function planExists(key){
  if(!key) return false;
  if(key.startsWith('custom_')) return !!(STATE.customPlans && STATE.customPlans[key.slice(7)]);
  if(key.startsWith('plyo_')) return !!PLYO[key.slice(5)] && !(STATE.hiddenPlans && STATE.hiddenPlans[key]);

/* ============================================================
   ADERÊNCIA — cumprimento do horário semanal definido pelo utilizador
   ============================================================ */
// dia neutro (não conta para aderência): sem horário definido, ou marcado como descanso/corrida
// ("corrida" ainda não tem registo próprio na app, por isso não é penalizado)
function isNeutralScheduleDay(dow){
  const s = STATE.schedule && STATE.schedule[dow];
  return !s || s==='rest' || s==='run';
}
function scheduleMet(dateObj){
  return !!(STATE.log[dateKey(dateObj)] && STATE.log[dateKey(dateObj)].length>0);
}
// dias consecutivos (a contar de hoje/ontem) em que o horário foi cumprido —
// dias neutros não quebram a sequência, só não a alimentam
function adherenceStreak(){
  let d = new Date();
  if(!isNeutralScheduleDay(d.getDay()) && !scheduleMet(d)) d.setDate(d.getDate()-1);
  let streak = 0;
  for(let i=0;i<365;i++){
    if(isNeutralScheduleDay(d.getDay())){ d.setDate(d.getDate()-1); continue; }
    if(scheduleMet(d)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
// % de dias de treino agendados (não-neutros) cumpridos nos últimos `days` dias — null se não houver nenhum dia agendado
function adherenceRate(days){
  let total=0, met=0;
  const d = new Date();
  for(let i=0;i<days;i++){
    if(!isNeutralScheduleDay(d.getDay())){ total++; if(scheduleMet(d)) met++; }
    d.setDate(d.getDate()-1);
  }
  return total ? Math.round(met/total*100) : null;
}
function adherenceGrid(){
  const cells = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const neutral = isNeutralScheduleDay(d.getDay());
    const isToday = dateKey(d)===todayKey();
    const met = !neutral && scheduleMet(d);
    let icon = neutral ? '' : met ? '✅' : isToday ? '⏳' : '❌';
    cells.push(`<div class="daycell ${isToday?'today':''}">
      <div class="dn">${WD[d.getDay()]}</div>
      <div class="dd">${d.getDate()}</div>
      <div style="font-size:13px;margin-top:4px;line-height:1">${icon}</div>
    </div>`);
  }
  return `<div class="weekstrip">${cells.join('')}</div>`;
}
function adherenceCard(){
  const streak = adherenceStreak();
  const rate7 = adherenceRate(7);
  const rate30 = adherenceRate(30);
  return `<div class="chart-card">
    <h4>🎯 Aderência ao horário</h4>
    <div class="csub">${rate7!=null ? `${rate7}% cumprido nos últimos 7 dias` : 'Define um horário semanal em Menu → Horário semanal para veres a aderência'}</div>
    ${adherenceGrid()}
    <div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--text-dim);font-weight:600">
      <div>🔥 <span style="color:var(--text);font-weight:800">${streak}</span> dia${streak!==1?'s':''} seguido${streak!==1?'s':''} a cumprir</div>
      ${rate30!=null ? `<div>30 dias: <span style="color:var(--text);font-weight:800">${rate30}%</span></div>` : ''}
    </div>
  </div>`;
}

// sugere o treino de hoje: primeiro pelo horário semanal definido pelo utilizador,
// com fallback para o ciclo PPL automático (rotação pelo último treino de força feito)
function suggestNextPlan(){
  const dow = new Date().getDay();
  const sched = STATE.schedule && STATE.schedule[dow];
  if(sched && sched!=='rest' && sched!=='run' && planExists(sched)) return sched;
  const order = ['push','pull','legs'].filter(k=> !(STATE.hiddenPlans && STATE.hiddenPlans[k]));
  if(!order.length) return null;
  const sessions = [];
  for(const date in STATE.log) STATE.log[date].forEach(s=> sessions.push(s));
  sessions.sort((a,b)=> b.when-a.when);
  const last = sessions.find(s=> order.includes(s.plan));
  if(!last) return order[0];
  return order[(order.indexOf(last.plan)+1)%order.length];
}

  if(STATE.customPlans && Object.keys(STATE.customPlans).length){

    for(const id in STATE.customPlans){
      const p = STATE.customPlans[id];
      html += `<div class="day-card" onclick="openSession('custom_${id}')" style="cursor:pointer">
        <div class="bar" style="background:${p.color||'var(--accent)'};box-shadow:0 0 10px 0 ${p.color||'var(--accent)'}"></div>
        <div class="icon" style="background:linear-gradient(135deg,${p.color||'var(--accent)'}40,${p.color||'var(--accent)'}14);color:${p.color||'var(--accent)'}">${p.icon||'🛠️'}</div>
        <div class="info"><h3>${p.name}</h3><p>${p.exercises.length} exercícios · plano personalizado</p></div>
        <button class="hdel" onclick="event.stopPropagation();deleteCustomPlan('${id}')" aria-label="Apagar plano">🗑</button>
      </div>`;
    }

  html += `<button class="day-card" onclick="openBuilder()" style="width:100%;text-align:left;border-style:dashed">
    <div class="icon" style="background:var(--surface-2);color:var(--text-dim)">+</div>
    <div class="info"><h3>Criar plano personalizado</h3><p>Escolhe exercícios da biblioteca e monta o teu treino</p></div>
  </button>`;
  html += `<button class="day-card" onclick="importPlanText()" style="width:100%;text-align:left;border-style:dashed">
    <div class="icon" style="background:var(--surface-2);color:var(--text-dim)">📥</div>
    <div class="info"><h3>Importar plano</h3><p>Cola um plano (JSON) que o Claude te tenha gerado no Knowledge Vault</p></div>
  </button>`;
  html += `<button class="day-card" onclick="importPlanHelp()" style="width:100%;text-align:left;border:none;background:none;box-shadow:none;padding:8px 4px;opacity:.7">
    <div class="info"><p>ℹ️ Como funciona a importação?</p></div>
  </button>`;

  $('#view-plans').innerHTML = html;
}

/* ============================================================
   SESSÃO
   ============================================================ */
function getPlan(key){
  if(key.startsWith('plyo_')) return {type:'plyo', data:PLYO[key.slice(5)], key};
  if(key.startsWith('custom_')){
    const cp = STATE.customPlans && STATE.customPlans[key.slice(7)];
    if(!cp) return {type:'strength', data:{name:'Plano apagado', color:'var(--accent)', icon:'⚠️', exercises:[]}, key};
    return {type:'strength', data:{...cp, exercises: applySwaps(key, cp.exercises)}, key};
  }
  return {type:'strength', data:{...STRENGTH[key], exercises: applySwaps(key, STRENGTH[key].exercises)}, key};
}

// aplica trocas de exercício persistentes (por posição no plano) guardadas em STATE.swaps
function applySwaps(planKey, exercises){
  const swaps = (STATE.swaps && STATE.swaps[planKey]) || {};
  return exercises.map((ex,i)=> swaps[i] || ex);
}
function swapExercise(planKey, idx, libId){
  const lib = libFind(libId);
  if(!lib) return;
  const base = getPlan(planKey).data.exercises[idx] || {};
  STATE.swaps = STATE.swaps || {};
  STATE.swaps[planKey] = STATE.swaps[planKey] || {};
  STATE.swaps[planKey][idx] = {
    id: lib.id, n: lib.n, m: lib.m||null, front: lib.front!=null?lib.front:1,
    cue: lib.cue, range: lib.range || base.range || '3 × 6-12',
    sets: lib.sets || base.sets || 3, rest: lib.rest || base.rest || 90,
  };
  saveState();
}

function openSession(key, forceNew){
  const plan = getPlan(key);
  // se já existe uma sessão em curso para este treino, retoma-a
  if(!forceNew && STATE.current && STATE.current.key===key){
    // mantém a sessão existente (retoma)
  } else if(!forceNew && STATE.current && STATE.current.key!==key && hasProgress(STATE.current)){
    // há outra sessão em curso com progresso — avisa
    const otherName = getPlan(STATE.current.key).data.name;
    if(confirm(`Tens um treino "${otherName}" a meio com progresso registado.\n\nOK = guardar esse progresso e começar "${plan.data.name}"\nCancelar = voltar ao treino "${otherName}"`)){
      STATE.current = { key, started:Date.now(), sets:{} };
    } else {
      key = STATE.current.key; // volta ao treino anterior
    }
  } else {
    // inicia sessão nova
    STATE.current = { key, started:Date.now(), sets:{} };
  }
  saveState();
  renderSession();
  nav('session');
  $$('.navbtn').forEach(b=>b.classList.remove('active'));
}

function hasProgress(session){
  if(!session || !session.sets) return false;
  for(const exid in session.sets){
    if(session.sets[exid].some(s=> s.w || s.r || s.done)) return true;
  }
  return false;
}

function resumeSession(){
  if(STATE.current){
    renderSession();
    nav('session');
    $$('.navbtn').forEach(b=>b.classList.remove('active'));
  }
}

function exThumb(ex){
  const m = ex.m || [];
  if(ex.front===0) return bodyBackSVG(m);
  // pliometria (sem grupos definidos) → corpo inteiro pernas destacadas
  if(!ex.m) return bodySVG(['quads','glutes','calves']);
  return bodySVG(m);
}

function renderSession(){
  const cur = STATE.current;
  if(!cur){ nav('home'); return; }
  const plan = getPlan(cur.key);
  const support = plan.type==='strength' ? SUPPORT[cur.key] : SUPPORT['legs']; // pliometria usa suporte de pernas
  const d = plan.data;

  $('#barTitle').textContent = d.name;
  $('#barSub').textContent = plan.type==='strength' ? 'Treino de força' : d.sub;

  let html = `<button class="backlink" onclick="nav('home')">‹ Voltar</button>`;
  html += `<div class="order-hint">Ordem do treino: Aquecimento → ${plan.type==='strength'?'Força':'Pliometria'} → Corretivo → Alongamento</div>`;

  const mainLabel = plan.type==='strength' ? '💪 Força' : '⚡ Pliometria';
  const mainCards = d.exercises.map((ex,i)=> exerciseCard(ex, i, plan.type, plan.key)).join('');

  // 1º AQUECIMENTO (fechado por omissão — é rotina rápida, não onde se perde tempo)
  if(support){
    html += accordion('🔥 1 · Aquecimento', 'Mobilidade + ativação', support.warmup.length+' exercícios', 'var(--warn)',
      support.warmup.map(s=>supportCard(s)).join(''), false);
  }
  // 2º TREINO PRINCIPAL (aberto por omissão — é aqui que registas séries a maior parte do tempo)
  html += accordion(`${plan.type==='strength'?'💪':'⚡'} 2 · ${plan.type==='strength'?'Força':'Pliometria'}`, d.name, d.exercises.length+' exercícios', d.color||'var(--accent)',
    mainCards, true, 'acc-main');
  // 3º CORRETIVO
  if(support){
    html += accordion('🩹 3 · Corretivo', 'Estabilidade', support.corrective.length+' exercícios', 'var(--accent)',
      support.corrective.map(s=>supportCard(s)).join(''), false);
    // 4º ALONGAMENTO
    html += accordion('🧘 4 · Alongamento', 'Flexibilidade', support.stretch.length+' alongamentos', 'var(--push)',
      support.stretch.map(s=>supportCard(s)).join(''), false);
  }

  html += `<div class="finish-bar">
    <button class="finish-btn" onclick="finishSession()">✓ Terminar treino</button>
    <button class="discard-btn" onclick="discardSession()">Descartar treino sem guardar</button>
  </div>`;

  $('#view-session').innerHTML = html;
  bindAccordions();

  // abre logo o primeiro exercício por terminar da secção principal — poupa um toque
  try{
    const firstId = firstIncompleteExerciseId(d.exercises);
    if(firstId){
      const card = document.getElementById('ex-'+firstId);
      const head = card && card.querySelector('.ex-head');
      if(head) toggleEx(head);
    }
  }catch(e){ /* não crítico — a secção continua utilizável mesmo sem abrir sozinha */ }
}
// devolve o id do primeiro exercício ainda sem todas as séries feitas (ou o primeiro, se nenhum tiver sets guardados)
function firstIncompleteExerciseId(exercises){
  const cur = STATE.current;
  for(const ex of exercises){
    const sets = cur && cur.sets && cur.sets[ex.id];
    const allDone = sets && sets.length>0 && sets.every(s=>s.done);
    if(!allDone) return ex.id;
  }
  return exercises.length ? exercises[0].id : null;
}

function accordion(label, title, sub, color, inner, open, id){
  return `<div class="accordion"${id?` id="${id}"`:''}>
    <button class="acc-head ${open?'open':''}" onclick="toggleAcc(this)">
      <div class="tag" style="background:linear-gradient(135deg,${color}40,${color}14);color:${color};font-weight:800">${label.split(' ')[0]}</div>
      <div class="htxt"><div class="t">${label.slice(label.indexOf(' ')+1)}</div><div class="s">${sub}</div></div>
      <div class="arrow">▶</div>
    </button>
    <div class="acc-body" ${open?'style="max-height:6000px"':''}><div class="acc-inner">${inner}</div></div>
  </div>`;
}

function exerciseCard(ex, idx, type, planKey){
  const cur = STATE.current;
  const saved = cur.sets[ex.id] || [];
  const isWeight = (type==='strength');
  return `<div class="ex" id="ex-${ex.id||'pl'+idx}" data-exid="${ex.id||'pl'+idx}">
    <div class="ex-head" onclick="toggleEx(this)">
      <div class="ex-thumb">${exThumb(ex)}</div>
      <div class="ex-meta">
        <div class="nm">${ex.n}</div>
        <div class="rg">${isWeight ? '<b>'+ex.range+'</b>' : ex.t}</div>
      </div>
      <div class="ex-done-dot"></div>
      <div class="ex-toggle">+</div>
    </div>
    <div class="ex-detail"><div class="ex-detail-in">
      ${ptDemo(ex.n, ex.cue, null, ex.videoId)}
      ${ isWeight && planKey ? `<button class="swap-btn" onclick="event.stopPropagation();openSwapPicker('${planKey}',${idx})">🔁 Trocar exercício</button>` : '' }
      ${ isWeight ? setsBlock(ex) : timedBlock(ex, type) }
    </div></div>
  </div>`;
}

function timedBlock(ex, type){
  // pliometria: descanso longo (recuperação p/ potência). 150s default.
  const rest = type==='plyo' ? 150 : 60;
  const rm = Math.floor(rest/60), rs = rest%60;
  const restStr = rm>0 ? `${rm}min${rs>0?' '+rs+'s':''}` : `${rs}s`;
  return `<div class="timed-info">⏱ ${ex.t}</div>
    <button class="rest-btn" onclick="startRest(${rest}, '${esc(ex.n)}')">
      <span class="rb-icon">▶</span>
      <span class="rb-text">Iniciar descanso · <b>${restStr}</b></span>
      <span class="rb-why">${type==='plyo'?'recuperação':'curto'}</span>
    </button>`;
}

function supportCard(s){
  return `<div class="ex">
    <div class="ex-head" onclick="toggleEx(this)">
      <div class="ex-thumb" style="display:grid;place-items:center;color:var(--accent);font-size:18px">●</div>
      <div class="ex-meta"><div class="nm">${s.n}</div><div class="rg">${s.t}</div></div>
      <div class="ex-toggle">+</div>
    </div>
    <div class="ex-detail"><div class="ex-detail-in">
      ${ptDemo(s.n, s.cue, s.pat, s.videoId)}
      <div class="quick-rest">
        <span class="qr-label">Descanso rápido:</span>
        <button onclick="startRest(30, '${esc(s.n)}')">30s</button>
        <button onclick="startRest(45, '${esc(s.n)}')">45s</button>
        <button onclick="startRest(60, '${esc(s.n)}')">60s</button>
      </div>
    </div></div>
  </div>`;
}

function setsBlock(ex){
  const cur = STATE.current;
  if(!cur.sets[ex.id]){
    cur.sets[ex.id] = Array.from({length:ex.sets},()=>({w:'',r:'',done:false}));
  }
  const rows = cur.sets[ex.id].map((s,i)=>`
    <div class="set-row ${s.done?'done':''}" data-set="${i}">
      <div class="snum">${i+1}</div>
      <input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" onchange="updSet('${ex.id}',${i},'w',this.value)">
      <input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" onchange="updSet('${ex.id}',${i},'r',this.value)">
      <button class="chk ${s.done?'on':''}" onclick="toggleSet('${ex.id}',${i},this)">✓</button>
    </div>`).join('');

  // indicador última carga
  const last = STATE.lastLoads && STATE.lastLoads[ex.id];
  let lastHtml = '';
  if(last && last.sets && last.sets.length){
    const summary = last.sets.map(x=>`${x.w||'–'}kg×${x.r||'–'}`).join('  ·  ');
    const d = new Date(last.when);
    lastHtml = `<div class="last-load">
      <span class="ll-tag">Última vez</span>
      <span class="ll-data">${summary}</span>
      <span class="ll-date">${d.getDate()}/${d.getMonth()+1}</span>
    </div>`;
  } else {
    lastHtml = `<div class="last-load empty"><span class="ll-tag">Primeira vez</span><span class="ll-data">Regista a tua carga inicial</span></div>`;
  }

  // tempo de descanso recomendado — botão que arranca o cronómetro
  const rest = ex.rest || 120;
  const rm = Math.floor(rest/60), rs = rest%60;
  const restStr = rm>0 ? `${rm}min${rs>0?' '+rs+'s':''}` : `${rs}s`;
  const why = rest>=150?'composto':rest>=100?'multi-articular':'isolamento';
  const restHtml = `<button class="rest-btn" onclick="startRest(${rest}, '${esc(ex.n)}')">
      <span class="rb-icon">▶</span>
      <span class="rb-text">Iniciar descanso · <b>${restStr}</b></span>
      <span class="rb-why">${why}</span>
    </button>`;

  return `${lastHtml}${restHtml}
    <div class="sets-hd"><div></div><div>Peso</div><div>Reps</div><div></div></div>
    ${rows}
    <button class="addset" onclick="addSet('${ex.id}',this)">+ Adicionar série</button>`;
}

/* ---- interações sets ---- */
function updSet(exid, i, field, val){
  STATE.current.sets[exid][i][field] = val;
  saveState();
}
function toggleSet(exid, i, btn){
  const s = STATE.current.sets[exid][i];
  s.done = !s.done;
  btn.classList.toggle('on', s.done);
  btn.closest('.set-row').classList.toggle('done', s.done);
  updateExDone(exid);
  if(s.done){
    const ex = findEx(exid);
    const rest = ex.rest || 120;
    startRest(rest, ex.n);
  }
  saveState();
}
function updateExDone(exid){
  const sets = STATE.current.sets[exid]||[];
  const allDone = sets.length>0 && sets.every(s=>s.done);
  const card = document.querySelector(`[data-exid="${exid}"]`);
  if(card) card.classList.toggle('completed', allDone);
}
function addSet(exid, btn){
  STATE.current.sets[exid].push({w:'',r:'',done:false});
  // re-render apenas o bloco de sets
  const detail = btn.closest('.ex-detail-in');
  const ex = findEx(exid);
  // rebuild sets area
  const tmp = document.createElement('div');
  tmp.innerHTML = setsBlock(ex);
  // substitui a partir do sets-hd
  const old = detail.querySelector('.sets-hd');
  while(old.nextSibling) old.nextSibling.remove();
  old.remove();
  detail.insertAdjacentHTML('beforeend', tmp.innerHTML);
  saveState();
  // reabre altura
  const body = detail.closest('.ex-detail');
  body.style.maxHeight = body.scrollHeight+200+'px';
}
function findEx(exid){
  for(const k in STRENGTH){
    const e = STRENGTH[k].exercises.find(x=>x.id===exid);
    if(e) return e;
  }
  if(STATE.customPlans){
    for(const id in STATE.customPlans){
      const e = STATE.customPlans[id].exercises.find(x=>x.id===exid);
      if(e) return e;
    }
  }
  const lib = EXERCISE_LIBRARY.find(e=>e.id===exid);
  if(lib) return lib;
  return {id:exid,sets:3};
}

/* ============================================================
   OVERLAY genérico (picker de exercícios / troca)
   ============================================================ */
function openOverlay(title, bodyHtml){
  closeOverlay();
  const ov = document.createElement('div');
  ov.className='ovl'; ov.id='ovl';
  ov.onclick = (e)=>{ if(e.target===ov) closeOverlay(); };
  ov.innerHTML = `<div class="ovl-panel">
    <div class="ovl-head"><div class="ovl-title">${title}</div><button class="ovl-close" onclick="closeOverlay()">✕</button></div>
    <div class="ovl-body" id="ovlBody">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(ov);
}
function closeOverlay(){ const ov=document.getElementById('ovl'); if(ov) ov.remove(); }

let PICKER = null;
function openSwapPicker(planKey, idx){
  const current = getPlan(planKey).data.exercises[idx];
  PICKER = { mode:'swap', planKey, idx, cat:'ginasio', q:'', excludeId:current.id, title:'Trocar: '+current.n };
  renderPicker();
}
function openBuildPicker(){
  PICKER = { mode:'build', cat:'ginasio', q:'', excludeId:null, title:'Adicionar exercício' };
  renderPicker();
}
function pickerThumb(e){
  if(e.m) return bodySVG(e.m);
  return `<div style="width:100%;height:100%;display:grid;place-items:center;font-size:16px;background:#0c1117">${e.cat==='pliometria'?'⚡':'🩹'}</div>`;
}
function renderPicker(){
  if(!PICKER) return;
  const list = EXERCISE_LIBRARY.filter(e=> e.cat===PICKER.cat && e.id!==PICKER.excludeId && (!PICKER.q || e.n.toLowerCase().includes(PICKER.q.toLowerCase())));
  const rows = list.map(e=> `<div class="lib-item" onclick="choosePickerExercise('${e.id}')">
      <div class="li-thumb">${pickerThumb(e)}</div>
      <div class="lib-info"><div class="lib-nm">${e.n}</div><div class="lib-tag">${e.catLabel}</div><div class="lib-cue">${(e.cue||'').slice(0,72)}${(e.cue||'').length>72?'…':''}</div></div>
      <div class="lib-add">${PICKER.mode==='swap'?'🔁':'+'}</div>
    </div>`).join('') || '<p class="tiny" style="color:var(--text-faint);padding:24px 4px;text-align:center">Sem exercícios nesta categoria.</p>';
  const cats = [['ginasio','Ginásio'],['arquivo','Arquivo (Notion)'],['pliometria','Pliometria'],['correcao','Correção']];
  const body = `<input class="lib-search" placeholder="Procurar exercício…" value="${(PICKER.q||'').replace(/"/g,'&quot;')}" oninput="PICKER.q=this.value;renderPicker()">
    <div class="ovl-tabs">${cats.map(([c,l])=>`<button class="ovl-tab ${PICKER.cat===c?'active':''}" onclick="PICKER.cat='${c}';renderPicker()">${l}</button>`).join('')}</div>
    <div>${rows}</div>`;
  openOverlay(PICKER.title, body);
}
function choosePickerExercise(libId){
  if(!PICKER) return;
  if(PICKER.mode==='swap'){
    swapExercise(PICKER.planKey, PICKER.idx, libId);
    closeOverlay(); PICKER=null;
    renderSession(); bindAccordions();
    toast('Exercício trocado 🔁');
  } else if(PICKER.mode==='build'){
    addToBuilder(libId);
  }
}

/* ============================================================
   HORÁRIO SEMANAL — atribui um plano (ou descanso/corrida) a cada dia
   ============================================================ */
function openSchedule(){
  renderScheduleView();
  nav('schedule');
  $$('.navbtn').forEach(b=>b.classList.remove('active'));
}
// opções disponíveis para um dia: por definir / descanso / corrida / planos ativos
function scheduleOptions(){
  const opts = [{key:'', name:'Por definir', icon:'—'}, {key:'rest', name:'Descanso', icon:'😴'}, {key:'run', name:'Corrida', icon:'🏃'}];
  for(const k in STRENGTH){ if(!(STATE.hiddenPlans && STATE.hiddenPlans[k])) opts.push({key:k, name:STRENGTH[k].name, icon:STRENGTH[k].icon}); }
  for(const k in PLYO){ const pk='plyo_'+k; if(!(STATE.hiddenPlans && STATE.hiddenPlans[pk])) opts.push({key:pk, name:PLYO[k].name, icon:PLYO[k].icon}); }
  for(const id in (STATE.customPlans||{})){ const p=STATE.customPlans[id]; opts.push({key:'custom_'+id, name:p.name, icon:p.icon||'🛠️'}); }
  return opts;
}
function scheduleRow(dow){
  const val = (STATE.schedule && STATE.schedule[dow]) || '';
  const opts = scheduleOptions();
  return `<div class="set-item" style="gap:12px">
    <div class="si-ic" style="width:40px;font-size:12px;font-weight:700">${WD[dow]}</div>
    <select class="lib-search" style="margin:0;padding:9px 10px" onchange="setScheduleDay(${dow}, this.value)">
      ${opts.map(o=>`<option value="${o.key}" ${val===o.key?'selected':''}>${o.icon} ${o.name}</option>`).join('')}
    </select>
  </div>`;
}
function renderScheduleView(){
  const html = `
    <button class="backlink" onclick="nav('menu')">‹ Voltar</button>
    <div class="sec-label">🗓️ Horário semanal</div>
    <div class="intro">Define o que treinas em cada dia. A sugestão do ecrã "Hoje" passa a seguir este horário (com o ciclo PPL automático como reserva nos dias sem plano definido).</div>
    <div class="set-card">
      ${[1,2,3,4,5,6,0].map(dow=>scheduleRow(dow)).join('')}
    </div>
  `;
  $('#view-schedule').innerHTML = html;
}
function setScheduleDay(dow, val){
  STATE.schedule = STATE.schedule || {};
  if(val) STATE.schedule[dow] = val; else delete STATE.schedule[dow];
  saveState();
}

/* ============================================================
   SAÚDE — sono, batimento em repouso, passos, prontidão (entrada manual)
   ============================================================ */
function openHealth(){
  renderHealthView();
  nav('health');
  $$('.navbtn').forEach(b=>b.classList.remove('active'));
}
function healthEntry(k){ return (STATE.health && STATE.health[k]) || {}; }
function saveHealthField(k, field, val){
  STATE.health = STATE.health || {};
  STATE.health[k] = STATE.health[k] || {};
  if(val==='' || val==null) delete STATE.health[k][field];
  else STATE.health[k][field] = val;
  if(!Object.keys(STATE.health[k]).length) delete STATE.health[k];
  saveState();
  renderHealthView();
}
function healthSleepChart(){
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push({d, e:healthEntry(dateKey(d))}); }
  const max = Math.max(8, ...days.map(x=>parseFloat(x.e.sleepHours)||0));
  const bars = days.map(x=>{
    const h = parseFloat(x.e.sleepHours)||0;

/* ============================================================
   IMPORTAR PLANO (do Knowledge Vault / Claude)
   Formato combinado, simples de pedir ao Claude gerar em JSON:
   - plano de força/pliometria (séries, pesos): { "name", "icon"?, "color"?,
     "exercises":[{ "n", "cue"?, "range"?, "sets"?, "rest"?, "videoId"? }] }
   - rotina de alongamento/mobilidade (sem pesos, só tempo): { "name", "icon"?,
     "items":[{ "n", "t"?, "cue"?, "pat"?, "videoId"? }] }
   Deteta automaticamente qual dos dois formatos foi colado.
   ============================================================ */
function importPlanText(){
  const raw = prompt('Cola aqui o JSON do plano gerado pelo Claude no Knowledge Vault:');
  if(!raw) return;
  let d;
  try{ d = JSON.parse(raw); }
  catch(e){ return toast('Isso não é JSON válido — cola exatamente o que o Claude te deu.'); }
  try{
    if(!d.name || !String(d.name).trim()) throw new Error('sem nome');
    if(Array.isArray(d.items)) importStretchRoutine(d);
    else if(Array.isArray(d.exercises)) importStrengthPlan(d);
    else throw new Error('formato desconhecido');
  }catch(e){
    return toast('Plano inválido: precisa de "name" + "exercises" ou "name" + "items".');
  }
  saveState();
  toast('Plano importado ✓');
  nav('home');
}
function importStrengthPlan(d){
  const id = 'imp'+Date.now().toString(36);
  const exercises = d.exercises.map((ex,i)=>{
    if(!ex.n) throw new Error('exercício sem nome');
    return { id:id+'_'+i, n:ex.n, m:ex.m||null, front: ex.front!=null?ex.front:1, cue:ex.cue||'', range:ex.range||'3 × 8-12', sets:ex.sets||3, rest:ex.rest||90, videoId:ex.videoId||null };
  });
  STATE.customPlans = STATE.customPlans || {};
  STATE.customPlans[id] = { id, name:String(d.name).trim(), icon:d.icon||'📥', color:d.color||'var(--accent)', exercises, createdAt:Date.now() };
}
function importStretchRoutine(d){
  const id = 'imp'+Date.now().toString(36);
  const items = d.items.map(it=>{
    if(!it.n) throw new Error('item sem nome');
    return { n:it.n, t:it.t||'30 seg', cue:it.cue||'', pat:it.pat||'stretch-hold', videoId:it.videoId||null };
  });
  STATE.customStretchRoutines = STATE.customStretchRoutines || {};
